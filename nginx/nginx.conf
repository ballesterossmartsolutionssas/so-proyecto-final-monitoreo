worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Log con el backend que atendió cada solicitud y cuánto tardó.
    log_format balanceo '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr instancia=$upstream_http_x_instance_id '
                        'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log balanceo;

    # Grupo de servidores backend. Por defecto Nginx usa Round Robin.
    # La "zone" comparte el estado del grupo entre los workers de Nginx;
    # sin ella cada worker lleva su propio turno y el reparto se ve desigual.
    upstream backend {
        zone backend 64k;
        server backend1:5000 max_fails=3 fail_timeout=10s;
        server backend2:5000 max_fails=3 fail_timeout=10s;
        server backend3:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Encabezados para ver el balanceo desde el navegador o con curl -I.
        add_header X-Upstream $upstream_addr always;
        add_header X-Backend-Instance $upstream_http_x_instance_id always;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            # Si un backend falla, prueba con el siguiente.
            proxy_next_upstream error timeout http_502 http_503;
        }

        # Las métricas de cada backend NO se publican hacia afuera:
        # Prometheus las lee directo por la red interna de Docker.
        location = /metrics {
            return 404;
        }
    }

    # Puerto interno (no publicado) para el exportador de Prometheus.
    server {
        listen 8088;
        access_log off;
        location = /stub_status {
            stub_status;
        }
    }
}
